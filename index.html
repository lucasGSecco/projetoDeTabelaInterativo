<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tabela para comp de fifinha</title>
</head>

<body>

        <header> <!--cabeçalho-->
                
            
                <h1>TABELA</h1>
                
                <nav> <!--lista não ordenada de outras páginas-->
                    
                        <a href="pag1.html">pag1</a>
                        <a href="mata-mata.html">tabela</a>
                        <a href="principal.html">principal</a>
                    
                </nav>
            

        </header>
        
        

        <main>
            <div class="form">
                <!--formulário para adição de jogadores-->
                <form>
                    <label>Nome do jogador</label>
                    <input type="text" id="player">

                    <input type="button" value="adicionar player" class="botao" onclick="adicionarPlayer()">

                    <input type="reset" value="limpar input" class="botao" onclick="limparPlayer()">
                </form>


                <!--<input type="button" value="finalizar campeoanto" class="botao" onclick="finalizarCamp()">
            -->
            </div>
        
            <div id="tabela"> <!--tabela dos jogadores-->
                <table border="1">
                    <thead class = "coluna">
                        <th>Nome</th>
                        <th>Pontos</th>
                    </thead>
                    <tbody id="tbody">

                    </tbody>
                </table>
            </div>

            <input type="button" value="Apagar último jogador colocado na tabela" onclick="apagar()">
        
        </main>



        <footer> <!--rodapé-->
            <p>rodapé</p>
        </footer>

    <script src="script.js"></script>
    
</body>

</html>
